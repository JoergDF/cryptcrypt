name: Fuzzing

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
    workflow_dispatch:
    schedule:
        - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
    fuzz:
        name: fuzzing
        permissions:
            contents: read
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [fuzzer_encdec, fuzzer_chunk_encdec, fuzzer_split]

        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Use nightly rust
              run: rustup override set nightly              
            - name: Get rust version
              run: rustc --version --verbose
            - name: Get cargo version
              run: cargo --version --verbose
            - name: Install additional packages for Linux
              run: sudo apt update && sudo apt install -y libudev-dev
            - name: Install fuzzer
              run: cargo install cargo-fuzz
            - name: Run fuzzer 
              run: |
                # Run for 60s on PRs, 10 minutes on scheduled runs
                DURATION=${{ github.event_name == 'schedule' && '600' || '60' }} 
                cargo fuzz run ${{ matrix.target }} -- -max_total_time=$DURATION
